openapi: 3.0.3
info:
  title: WhuzPay Payment Gateway Aggregator API
  description: |
    REST API for the WhuzPay QRIS payment gateway aggregator. Orchestrates
    payment providers (Cashi in production, an in-process mock for
    merchant sandbox) behind one consistent API and dashboard.

    Generated from the actual route table in `cmd/api/main.go` and the
    handler/service/domain source — not hand-guessed. See
    [docs/payment-state-machine.md](payment-state-machine.md) for the
    payment status lifecycle these endpoints read and write.

    Request bodies are capped at 1 MiB. Only the provider webhook answers an
    oversize body with 413; other JSON endpoints answer 400 `Invalid request
    body`.

    Payment statuses: `pending`, `paid`, `expired`, `failed`, `cancelled`,
    `refunded`. `refunded` is terminal and is reached only from `paid`, by an
    admin full refund; amounts are integer rupiah and a payment `amount` is at
    most 1000000000000.

    Session tokens (admin and merchant JWTs) are revoked server-side: logout
    and changing the password invalidate every token issued before that
    moment, and an inactive account's token is rejected with 401.
  version: "1.0"
  license:
    name: Proprietary
servers:
  - url: http://localhost:8080/api/v1
    description: Local development

tags:
  - name: Auth (Merchant)
    description: Merchant dashboard login/session (JWT)
  - name: Auth (Admin)
    description: Admin panel login/session (JWT)
  - name: Admin - Dashboard
  - name: Admin - Payments
  - name: Admin - Merchants
  - name: Admin - Providers
  - name: Admin - Routing
  - name: Admin - Reconciliation
  - name: Admin - Notifications
  - name: Admin - Callbacks
  - name: Admin - Logs
  - name: Admin - Balances & Payouts
    description: Merchant balances, payouts, refunds and manual adjustments
  - name: Merchant Dashboard
  - name: Merchant Balance & Payouts
  - name: Merchant Payment Links
  - name: Public
    description: No authentication — customer-facing checkout
  - name: Merchant API
    description: Server-to-server integration, authenticated via API key
  - name: Webhooks
  - name: Health

security: []

paths:
  # ---------------------------------------------------------------- Auth (Merchant)
  /auth/login:
    post:
      tags: [Auth (Merchant)]
      summary: Merchant dashboard login
      description: Rate limited 5 req/min per IP (classic brute-force target).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserLoginRequest' }
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserLoginResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { description: Invalid email or password, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '403': { description: Merchant/user inactive, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/register:
    post:
      tags: [Auth (Merchant)]
      summary: Register a new merchant
      description: Rate limited 5 req/min per IP.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201':
          description: Merchant created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RegisteredMerchant' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { description: Email already registered, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/logout:
    post:
      tags: [Auth (Merchant)]
      summary: Sign out (revoke every existing merchant session token)
      description: |
        Revokes ALL tokens issued to this user before now (not only the one
        sent), on every device. Response `{"message":"Signed out"}`.
      security: [{ merchantBearer: [] }]
      responses:
        '200': { description: Signed out }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/me:
    get:
      tags: [Auth (Merchant)]
      summary: Get current merchant user profile
      security: [{ merchantBearer: [] }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/UserResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/profile:
    put:
      tags: [Auth (Merchant)]
      summary: Update merchant user profile (name/email)
      security: [{ merchantBearer: [] }]
      requestBody:
        content: { application/json: { schema: { type: object, properties: { name: { type: string }, email: { type: string } } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/UserResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/change-password:
    post:
      tags: [Auth (Merchant)]
      summary: Change merchant user password
      description: |
        Rate limited 10 req/min per IP (project backlog #8) — previously
        unlimited once past JWT auth. A successful change revokes every
        existing token of this user (including the one used for this call);
        log in again.
      security: [{ merchantBearer: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                current_password: { type: string }
                new_password: { type: string, minLength: 8 }
      responses:
        '200': { description: Password changed }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { description: "Missing/invalid token, or current password incorrect" }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  # ---------------------------------------------------------------- Auth (Admin)
  /auth/admin/login:
    post:
      tags: [Auth (Admin)]
      summary: Admin login
      description: Rate limited 5 req/min per IP.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AdminLoginRequest' } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/AdminLoginResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { description: Invalid credentials }
        '403': { description: Admin inactive }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/admin/logout:
    post:
      tags: [Auth (Admin)]
      summary: Sign out (revoke every existing admin session token)
      description: |
        Revokes ALL tokens issued to this admin before now, on every device.
        Response `{"message":"Signed out"}`.
      security: [{ adminBearer: [] }]
      responses:
        '200': { description: Signed out }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/admin/me:
    get:
      tags: [Auth (Admin)]
      summary: Get current admin profile
      security: [{ adminBearer: [] }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/AdminResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/admin/profile:
    put:
      tags: [Auth (Admin)]
      summary: Update admin profile
      security: [{ adminBearer: [] }]
      requestBody:
        content: { application/json: { schema: { type: object, properties: { name: { type: string }, email: { type: string } } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/AdminResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { description: Email already in use }

  /auth/admin/change-password:
    post:
      tags: [Auth (Admin)]
      summary: Change admin password
      description: |
        Rate limited 10 req/min per IP (project backlog #8). A successful
        change revokes every existing token of this admin (including the one
        used for this call); log in again.
      security: [{ adminBearer: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                current_password: { type: string }
                new_password: { type: string, minLength: 8 }
      responses:
        '200': { description: Password changed }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { description: "Missing/invalid token, or current password incorrect" }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  # ---------------------------------------------------------------- Admin - Dashboard
  /admin/dashboard/summary:
    get:
      tags: [Admin - Dashboard]
      summary: Global payment/merchant counters
      security: [{ adminBearer: [] }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/DashboardSummary' } } } }

  /admin/dashboard/charts:
    get:
      tags: [Admin - Dashboard]
      summary: Daily payment chart + status breakdown
      security: [{ adminBearer: [] }]
      parameters:
        - { name: days, in: query, schema: { type: integer, default: 14, maximum: 90 } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/DashboardCharts' } } } }

  # ---------------------------------------------------------------- Admin - Payments
  /admin/payments:
    get:
      tags: [Admin - Payments]
      summary: List payments (admin view, all merchants)
      security: [{ adminBearer: [] }]
      parameters:
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Offset' }
        - { name: status, in: query, schema: { type: string } }
        - { name: search, in: query, schema: { type: string } }
        - { name: merchant_id, in: query, schema: { type: string, format: uuid } }
        - { name: environment, in: query, schema: { type: string, enum: [sandbox, production] } }
        - { name: date_from, in: query, schema: { type: string, format: date-time } }
        - { name: date_to, in: query, schema: { type: string, format: date-time } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/PaginatedPayments' } } } }
    post:
      tags: [Admin - Payments]
      summary: Create a payment on behalf of a merchant
      security: [{ adminBearer: [] }]
      requestBody:
        content: { application/json: { schema: { $ref: '#/components/schemas/CreatePaymentRequest' } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/PaymentResponse' } } } }
        '400': { description: 'Invalid request, including `amount` outside 1..1000000000000', content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '502': { description: The payment provider answered with an error or an invalid response. No payment was recorded. }
        '503': { description: "No payment provider is available right now, or the provider could not be reached. No payment was recorded." }
        '504': { description: The payment provider did not answer in time. No payment was recorded. }

  /admin/payments/export:
    get:
      tags: [Admin - Payments]
      summary: Export payments as CSV
      description: The last two columns are `fee_amount` and `total_amount` (`amount` + `fee_amount`); `amount` stays the merchant nominal.
      security: [{ adminBearer: [] }]
      parameters:
        - { name: status, in: query, schema: { type: string } }
        - { name: search, in: query, schema: { type: string } }
        - { name: merchant_id, in: query, schema: { type: string, format: uuid } }
        - { name: environment, in: query, schema: { type: string } }
        - { name: date_from, in: query, schema: { type: string, format: date-time } }
        - { name: date_to, in: query, schema: { type: string, format: date-time } }
      responses:
        '200': { description: CSV file, content: { text/csv: { schema: { type: string, format: binary } } } }

  /admin/payments/{id}:
    get:
      tags: [Admin - Payments]
      summary: Get payment detail
      security: [{ adminBearer: [] }]
      parameters: [{ $ref: '#/components/parameters/PathID' }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/AdminPaymentDetail' } } } }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/payments/{id}/events:
    get:
      tags: [Admin - Payments]
      summary: List webhook events for a payment
      security: [{ adminBearer: [] }]
      parameters: [{ $ref: '#/components/parameters/PathID' }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/AdminLogItem' } } } } }

  /admin/payments/{id}/callbacks:
    get:
      tags: [Admin - Payments]
      summary: List outbound merchant-webhook callback attempts for a payment
      security: [{ adminBearer: [] }]
      parameters: [{ $ref: '#/components/parameters/PathID' }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/AdminCallbackItem' } } } } }

  # ---------------------------------------------------------------- Admin - Merchants
  /admin/merchants:
    get:
      tags: [Admin - Merchants]
      summary: List merchants
      security: [{ adminBearer: [] }]
      parameters:
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Offset' }
        - { name: search, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string, enum: [active, inactive] } }
        - { name: date_from, in: query, description: Registration (created_at) window start, inclusive (YYYY-MM-DD, UTC), schema: { type: string, format: date } }
        - { name: date_to, in: query, description: Registration window end, inclusive (YYYY-MM-DD, UTC); must not be before date_from, schema: { type: string, format: date } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/PaginatedMerchants' } } } }
    post:
      tags: [Admin - Merchants]
      summary: Create a merchant
      security: [{ adminBearer: [] }]
      requestBody:
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateMerchantRequest' } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/MerchantResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { description: Merchant with this email already exists }

  /admin/merchants/export:
    get:
      tags: [Admin - Merchants]
      summary: Export merchants as CSV
      security: [{ adminBearer: [] }]
      parameters:
        - { name: search, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string } }
        - { name: date_from, in: query, description: Registration (created_at) window start, inclusive (YYYY-MM-DD, UTC), schema: { type: string, format: date } }
        - { name: date_to, in: query, description: Registration window end, inclusive (YYYY-MM-DD, UTC); must not be before date_from, schema: { type: string, format: date } }
      responses:
        '200': { description: CSV file, content: { text/csv: { schema: { type: string, format: binary } } } }

  /admin/merchants/stats:
    get:
      tags: [Admin - Merchants]
      summary: Merchant summary for the admin Merchants page
      description: >
        Head counts, what the platform owes merchants (sum of every merchant's
        ledger balance, negative balances included) and merchant sign-ups per
        day for the last 14 days (days without sign-ups are present with
        count 0, oldest first; same day bucketing as the dashboard charts).
      security: [{ adminBearer: [] }]
      responses:
        '200':
          description: Merchant statistics
          content:
            application/json:
              schema:
                type: object
                required: [total, active, inactive, total_balance, negative_balance_count, days, signups_daily]
                properties:
                  total: { type: integer, format: int64 }
                  active: { type: integer, format: int64 }
                  inactive: { type: integer, format: int64 }
                  total_balance: { type: integer, format: int64, description: Sum of all merchant ledger balances (IDR) }
                  negative_balance_count: { type: integer, format: int64, description: Merchants whose balance is below zero }
                  days: { type: integer, example: 14 }
                  signups_daily:
                    type: array
                    items:
                      type: object
                      required: [date, label, count]
                      properties:
                        date: { type: string, example: '2026-11-10' }
                        label: { type: string, example: '10 Nov' }
                        count: { type: integer, format: int64 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { description: Failed to load merchant stats }

  /admin/merchants/{id}:
    get:
      tags: [Admin - Merchants]
      summary: Get merchant
      security: [{ adminBearer: [] }]
      parameters: [{ $ref: '#/components/parameters/PathID' }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/MerchantResponse' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Admin - Merchants]
      summary: Update merchant
      security: [{ adminBearer: [] }]
      parameters: [{ $ref: '#/components/parameters/PathID' }]
      requestBody:
        content: { application/json: { schema: { $ref: '#/components/schemas/UpdateMerchantRequest' } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/MerchantResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/merchants/{id}/status:
    put:
      tags: [Admin - Merchants]
      summary: Activate/deactivate a merchant
      security: [{ adminBearer: [] }]
      parameters: [{ $ref: '#/components/parameters/PathID' }]
      requestBody:
        content: { application/json: { schema: { type: object, properties: { is_active: { type: boolean } } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/MerchantResponse' } } } }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/merchants/{id}/fee-bearer:
    put:
      tags: [Admin - Merchants]
      summary: Set who bears the provider fee for a merchant
      description: |
        Admin only. `customer` adds the provider fee on top of the nominal for NEW payments;
        existing payments keep their stored `fee_amount`. Not available to merchants.
      security: [{ adminBearer: [] }]
      parameters: [{ $ref: '#/components/parameters/PathID' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fee_bearer]
              properties:
                fee_bearer: { type: string, enum: [merchant, customer] }
      responses:
        '200': { description: OK (the updated merchant), content: { application/json: { schema: { $ref: '#/components/schemas/MerchantResponse' } } } }
        '400': { description: Invalid merchant id or fee_bearer not 'merchant' or 'customer', content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/merchants/{id}/payments:
    get:
      tags: [Admin - Merchants]
      summary: List a merchant's payments
      security: [{ adminBearer: [] }]
      parameters:
        - { $ref: '#/components/parameters/PathID' }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Offset' }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/PaginatedPayments' } } } }

  /admin/merchants/{id}/api-keys:
    get:
      tags: [Admin - Merchants]
      summary: List a merchant's API keys (admin view)
      security: [{ adminBearer: [] }]
      parameters: [{ $ref: '#/components/parameters/PathID' }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/APIKeyPublic' } } } } }
    put:
      tags: [Admin - Merchants]
      summary: Create/rotate a merchant's API key (admin-initiated)
      description: Rate limited 10 req/min per IP (project backlog #8).
      security: [{ adminBearer: [] }]
      parameters: [{ $ref: '#/components/parameters/PathID' }]
      requestBody:
        content: { application/json: { schema: { $ref: '#/components/schemas/UpsertAPIKeyRequest' } } }
      responses:
        '200': { description: OK — secret shown once, content: { application/json: { schema: { $ref: '#/components/schemas/UpsertAPIKeyResponse' } } } }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    post:
      tags: [Admin - Merchants]
      summary: Create/rotate a merchant's API key (admin-initiated)
      description: Same as PUT. Rate limited 10 req/min per IP.
      security: [{ adminBearer: [] }]
      parameters: [{ $ref: '#/components/parameters/PathID' }]
      requestBody:
        content: { application/json: { schema: { $ref: '#/components/schemas/UpsertAPIKeyRequest' } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/UpsertAPIKeyResponse' } } } }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /admin/merchants/{id}/api-keys/{keyId}:
    delete:
      tags: [Admin - Merchants]
      summary: Revoke a merchant's API key
      description: Rate limited 10 req/min per IP (project backlog #8).
      security: [{ adminBearer: [] }]
      parameters:
        - { $ref: '#/components/parameters/PathID' }
        - { name: keyId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Deleted }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /admin/merchants/{id}/provider-configs:
    get:
      tags: [Admin - Merchants]
      summary: List a merchant's provider routing configs
      security: [{ adminBearer: [] }]
      parameters: [{ $ref: '#/components/parameters/PathID' }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/MerchantProviderConfig' } } } } } } }
    post:
      tags: [Admin - Merchants]
      summary: Upsert a merchant's provider routing config
      description: Returns the merchant's full refreshed config list (project backlog #6/#7 — collapsed from two round-trips into one).
      security: [{ adminBearer: [] }]
      parameters: [{ $ref: '#/components/parameters/PathID' }]
      requestBody:
        content: { application/json: { schema: { $ref: '#/components/schemas/UpsertMerchantProviderConfigRequest' } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/MerchantProviderConfig' } } } } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Admin - Merchants]
      summary: Upsert a merchant's provider routing config
      description: Same as POST.
      security: [{ adminBearer: [] }]
      parameters: [{ $ref: '#/components/parameters/PathID' }]
      requestBody:
        content: { application/json: { schema: { $ref: '#/components/schemas/UpsertMerchantProviderConfigRequest' } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/MerchantProviderConfig' } } } } } } }
    delete:
      tags: [Admin - Merchants]
      summary: Delete a merchant's provider routing config
      security: [{ adminBearer: [] }]
      parameters:
        - { $ref: '#/components/parameters/PathID' }
        - { name: payment_method, in: query, required: true, schema: { type: string } }
        - { name: provider_name, in: query, required: true, schema: { type: string } }
      responses:
        '200': { description: Deleted }

  # ---------------------------------------------------------------- Admin - Providers
  /admin/providers:
    get:
      tags: [Admin - Providers]
      summary: List registered payment providers
      security: [{ adminBearer: [] }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/ProviderInfo' } } } } } } }

  /admin/providers/{name}:
    get:
      tags: [Admin - Providers]
      summary: Get provider detail + merchant routing count
      security: [{ adminBearer: [] }]
      parameters: [{ name: name, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ProviderDetail' } } } }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/providers/{name}/health:
    put:
      tags: [Admin - Providers]
      summary: Set provider health status (in-memory, affects routing)
      description: |
        Setting a provider `unhealthy` makes `ProviderRouter.SelectProviders`
        skip it entirely — this endpoint can halt production payment
        creation for that provider. Admin-only, JWT protected (see project
        backlog security fix: this used to also be reachable
        unauthenticated at a since-removed duplicate route).
      security: [{ adminBearer: [] }]
      parameters: [{ name: name, in: path, required: true, schema: { type: string } }]
      requestBody:
        content: { application/json: { schema: { $ref: '#/components/schemas/UpdateProviderHealthRequest' } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ProviderDetail' } } } }
        '400': { description: Invalid health status }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------------------------------------------------------- Admin - Routing
  /admin/routing:
    get:
      tags: [Admin - Routing]
      summary: List all merchant → provider routing configs
      security: [{ adminBearer: [] }]
      parameters:
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Offset' }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/PaginatedRouting' } } } }

  # ---------------------------------------------------------------- Admin - Reconciliation
  /admin/reconciliation:
    get:
      tags: [Admin - Reconciliation]
      summary: List pending payments that may need a provider status check
      security: [{ adminBearer: [] }]
      parameters: [{ name: limit, in: query, schema: { type: integer, default: 50 } }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ReconciliationResponse' } } } }

  /admin/reconciliation/check:
    post:
      tags: [Admin - Reconciliation]
      summary: Batch-poll providers for pending payments and sync status
      security: [{ adminBearer: [] }]
      parameters: [{ name: limit, in: query, schema: { type: integer, default: 20, maximum: 50 } }]
      responses:
        '200':
          description: Batch summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  total: { type: integer }
                  updated: { type: integer }
                  unchanged: { type: integer }
                  expired: { type: integer }
                  skipped: { type: integer }
                  errored: { type: integer }
                  results: { type: array, items: { $ref: '#/components/schemas/ReconcileResult' } }

  /admin/reconciliation/{id}/check:
    post:
      tags: [Admin - Reconciliation]
      summary: Poll the provider for one payment and sync status
      security: [{ adminBearer: [] }]
      parameters: [{ $ref: '#/components/parameters/PathID' }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ReconcileResult' } } } }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------------------------------------------------------- Admin - Notifications
  /admin/notifications:
    get:
      tags: [Admin - Notifications]
      summary: Operational alert feed (failed webhooks, failed/expired payments)
      security: [{ adminBearer: [] }]
      parameters: [{ name: limit, in: query, schema: { type: integer, default: 30, maximum: 50 } }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/NotificationsResponse' } } } }

  # ---------------------------------------------------------------- Admin - Callbacks
  /admin/callbacks:
    get:
      tags: [Admin - Callbacks]
      summary: List outbound merchant-webhook callback deliveries
      security: [{ adminBearer: [] }]
      parameters:
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Offset' }
        - { name: status, in: query, schema: { type: string, enum: [pending, sending, success, failed, skipped] } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/PaginatedCallbacks' } } } }

  /admin/callbacks/stats:
    get:
      tags: [Admin - Callbacks]
      summary: Callback delivery summary for the admin Callbacks page
      description: >
        Delivery counts per outcome (pending includes sending) and deliveries
        per day (by created_at) for the last 14 days split into success,
        failed and other (pending, sending, skipped).
      security: [{ adminBearer: [] }]
      responses:
        '200':
          description: Callback statistics
          content:
            application/json:
              schema:
                type: object
                required: [days, total, success, failed, pending, skipped, daily, breakdown]
                properties:
                  days: { type: integer, example: 14 }
                  total: { type: integer, format: int64 }
                  success: { type: integer, format: int64 }
                  failed: { type: integer, format: int64 }
                  pending: { type: integer, format: int64, description: pending + sending }
                  skipped: { type: integer, format: int64 }
                  daily:
                    type: array
                    description: Exactly 14 points, oldest first; days without rows are zero
                    items:
                      type: object
                      required: [date, label, success, failed, other]
                      properties:
                        date: { type: string, example: '2026-11-10' }
                        label: { type: string, example: '10 Nov' }
                        success: { type: integer, format: int64 }
                        failed: { type: integer, format: int64 }
                        other: { type: integer, format: int64 }
                  breakdown:
                    type: array
                    description: One entry per status present (empty array when there are no rows)
                    items:
                      type: object
                      required: [status, count]
                      properties:
                        status: { type: string }
                        count: { type: integer, format: int64 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { description: Failed to load callback stats }

  /admin/callbacks/{id}/retry:
    post:
      tags: [Admin - Callbacks]
      summary: Manually retry one failed callback delivery
      description: |
        Sends synchronously as a new attempt row. The destination is the payment's
        current `callback_url`, else the merchant's current `webhook_url`; the
        delivery's stored URL is used only when the payment is gone or neither is
        set. The URL is validated again, so a URL that is still invalid fails the
        new attempt without being contacted.
      security: [{ adminBearer: [] }]
      parameters: [{ $ref: '#/components/parameters/PathID' }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/AdminCallbackItem' } } } }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------------------------------------------------------- Admin - Logs
  /admin/logs:
    get:
      tags: [Admin - Logs]
      summary: List raw provider webhook events
      security: [{ adminBearer: [] }]
      parameters:
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Offset' }
        - { name: status, in: query, schema: { type: string } }
        - { name: provider_name, in: query, schema: { type: string } }
        - { name: processed, in: query, schema: { type: string, enum: ['yes', 'no'] } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/PaginatedLogs' } } } }

  /admin/logs/stats:
    get:
      tags: [Admin - Logs]
      summary: Webhook event summary for the admin Logs page
      description: >
        Provider webhook events (webhook_events). processed = is_processed;
        ignored = processing_error is exactly one of the benign messages
        (webhook not a settlement, duplicate webhook, payment already terminal,
        provider test event); failed = not ignored and (processing_error is set
        or status is rejected/failed). ignored and failed are disjoint; an event
        can be none of them (still received). ignored appears only in the
        totals. Daily series (processed, failed) covers the last 14 days by
        created_at.
      security: [{ adminBearer: [] }]
      responses:
        '200':
          description: Webhook event statistics
          content:
            application/json:
              schema:
                type: object
                required: [days, total, processed, failed, ignored, daily, breakdown]
                properties:
                  days: { type: integer, example: 14 }
                  total: { type: integer, format: int64 }
                  processed: { type: integer, format: int64 }
                  failed: { type: integer, format: int64 }
                  ignored: { type: integer, format: int64, description: Benign non-processed events (not failures) }
                  daily:
                    type: array
                    description: Exactly 14 points, oldest first; days without rows are zero
                    items:
                      type: object
                      required: [date, label, processed, failed]
                      properties:
                        date: { type: string, example: '2026-11-10' }
                        label: { type: string, example: '10 Nov' }
                        processed: { type: integer, format: int64 }
                        failed: { type: integer, format: int64 }
                  breakdown:
                    type: array
                    description: One entry per status present (empty array when there are no rows)
                    items:
                      type: object
                      required: [status, count]
                      properties:
                        status: { type: string }
                        count: { type: integer, format: int64 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { description: Failed to load log stats }

  /admin/logs/export:
    get:
      tags: [Admin - Logs]
      summary: Export webhook event logs as CSV
      security: [{ adminBearer: [] }]
      responses:
        '200': { description: CSV file, content: { text/csv: { schema: { type: string, format: binary } } } }

  /admin/logs/{id}:
    get:
      tags: [Admin - Logs]
      summary: Get one webhook event, with secrets redacted from the raw payload
      security: [{ adminBearer: [] }]
      parameters: [{ $ref: '#/components/parameters/PathID' }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/AdminLogDetail' } } } }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------------------------------------------------------- Admin - Balances, Payouts, Refunds
  /admin/balances:
    get:
      tags: [Admin - Balances & Payouts]
      summary: Every merchant's balance, highest first
      description: |
        Balance = sum of the merchant's ledger (production payments only).
        `negative=true` keeps only merchants below zero (balances can go
        negative after a refund or debit adjustment; they are not collected
        automatically, so this filter is the monitoring view).
        `limit` defaults to 20 and is capped at 100.
      security: [{ adminBearer: [] }]
      parameters:
        - { name: negative, in: query, schema: { type: boolean }, description: 'Only `true` filters; any other value is ignored.' }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Offset' }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/PaginatedAdminBalances' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /admin/payouts:
    get:
      tags: [Admin - Balances & Payouts]
      summary: List payout requests (queue and history)
      security: [{ adminBearer: [] }]
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [requested, paid, rejected] }, description: Omit for all statuses. Any other value is a 400. }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Offset' }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/PaginatedAdminPayouts' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /admin/payouts/stats:
    get:
      tags: [Admin - Balances & Payouts]
      summary: Payout summary for the admin Payouts page
      description: >
        Count and total amount (IDR) of payouts per status plus payout requests
        per day (by requested_at) for the last 14 days (same day bucketing as
        the dashboard charts).
      security: [{ adminBearer: [] }]
      responses:
        '200':
          description: Payout statistics
          content:
            application/json:
              schema:
                type: object
                required: [days, requested_count, requested_amount, paid_count, paid_amount, rejected_count, rejected_amount, daily, breakdown]
                properties:
                  days: { type: integer, example: 14 }
                  requested_count: { type: integer, format: int64 }
                  requested_amount: { type: integer, format: int64 }
                  paid_count: { type: integer, format: int64 }
                  paid_amount: { type: integer, format: int64 }
                  rejected_count: { type: integer, format: int64 }
                  rejected_amount: { type: integer, format: int64 }
                  daily:
                    type: array
                    description: Exactly 14 points, oldest first; days without rows are zero
                    items:
                      type: object
                      required: [date, label, count, amount]
                      properties:
                        date: { type: string, example: '2026-11-10' }
                        label: { type: string, example: '10 Nov' }
                        count: { type: integer, format: int64 }
                        amount: { type: integer, format: int64 }
                  breakdown:
                    type: array
                    description: One entry per status present (empty array when there are no rows)
                    items:
                      type: object
                      required: [status, count]
                      properties:
                        status: { type: string }
                        count: { type: integer, format: int64 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { description: Failed to load payout stats }

  /admin/payouts/{id}/pay:
    post:
      tags: [Admin - Balances & Payouts]
      summary: Mark a payout as paid (after transferring manually)
      description: |
        Status `requested` -> `paid`. No ledger row is written (the debit was
        written when the payout was requested). Payouts are final: a payout
        that is already `paid` or `rejected` answers 409. Uses the general
        `api` rate-limit bucket.
      security: [{ adminBearer: [] }]
      parameters: [{ $ref: '#/components/parameters/PathID' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PayPayoutRequest' } } }
      responses:
        '200': { description: Payout marked paid, content: { application/json: { schema: { $ref: '#/components/schemas/AdminPayout' } } } }
        '400': { description: "Invalid payout ID or body, or `reference` blank or longer than 200 characters", content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /admin/payouts/{id}/reject:
    post:
      tags: [Admin - Balances & Payouts]
      summary: Reject a payout and return the amount to the balance
      description: |
        Status `requested` -> `rejected` and a `payout_reversal` ledger row
        (positive) in the same transaction. Same finality and 409 rule as
        `pay`. Uses the general `api` rate-limit bucket.
      security: [{ adminBearer: [] }]
      parameters: [{ $ref: '#/components/parameters/PathID' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/RejectPayoutRequest' } } }
      responses:
        '200': { description: Payout rejected, content: { application/json: { schema: { $ref: '#/components/schemas/AdminPayout' } } } }
        '400': { description: "Invalid payout ID or body, or `reason` blank or longer than 500 characters", content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /admin/payments/{id}/refund:
    post:
      tags: [Admin - Balances & Payouts]
      summary: Record a partial or full refund of a paid production payment
      description: |
        Admin only; merchants cannot refund. The money to the customer is
        returned manually outside the platform; this records it. `amount` is
        the part of the merchant NET (`merchant_net_amount`) to take back
        from the merchant's balance, at most the net not yet refunded.
        In one transaction (payment row locked): a `payment_refunds` row, a
        `refund_debit` ledger row and, when the accumulated refunds reach the
        net, status `paid` -> `refunded` (terminal) plus a `payment.refunded`
        merchant callback (full refunds only, queued after commit). A partial
        refund leaves the payment `paid` and sends no callback. The balance
        may go negative. Uses the general `api` rate-limit bucket.
      security: [{ adminBearer: [] }]
      parameters: [{ $ref: '#/components/parameters/PathID' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/RefundRequest' } } }
      responses:
        '201': { description: Refund recorded, content: { application/json: { schema: { $ref: '#/components/schemas/RefundResponse' } } } }
        '400': { description: "Invalid payment ID or body, `amount` <= 0, or `reason` blank or longer than 500 characters", content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: 'The payment cannot be refunded: not `paid`, a sandbox payment, already `refunded`, or its net amount is 0', content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '422': { description: Refund exceeds the refundable amount, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /admin/payments/{id}/refunds:
    get:
      tags: [Admin - Balances & Payouts]
      summary: A payment's refunds and refundable figures
      security: [{ adminBearer: [] }]
      parameters: [{ $ref: '#/components/parameters/PathID' }]
      responses:
        '200': { description: "OK (items newest first; `[]` when none)", content: { application/json: { schema: { $ref: '#/components/schemas/RefundSummary' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /admin/merchants/{id}/adjustments:
    post:
      tags: [Admin - Balances & Payouts]
      summary: Manual credit (positive) or debit (negative) on a merchant's ledger
      description: |
        Writes an `adjustment` ledger row. `amount` is non-zero and at most
        1000000000000 in absolute value; `reason` is required (max 500
        characters). A debit may push the balance negative. Uses the general
        `api` rate-limit bucket.
      security: [{ adminBearer: [] }]
      parameters: [{ $ref: '#/components/parameters/PathID' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AdjustmentRequest' } } }
      responses:
        '201': { description: Adjustment recorded, content: { application/json: { schema: { $ref: '#/components/schemas/AdminLedgerEntry' } } } }
        '400': { description: "Invalid merchant ID or body, `amount` zero or out of range, or `reason` blank or too long", content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: Merchant not found, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /admin/merchants/{id}/ledger:
    get:
      tags: [Admin - Balances & Payouts]
      summary: A merchant's ledger, newest first
      description: An unknown merchant id answers 200 with an empty list, not 404.
      security: [{ adminBearer: [] }]
      parameters:
        - { $ref: '#/components/parameters/PathID' }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Offset' }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/PaginatedAdminLedger' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  # ---------------------------------------------------------------- Merchant Dashboard
  /merchant/dashboard/summary:
    get:
      tags: [Merchant Dashboard]
      summary: Payment counters for the authenticated merchant
      description: |
        Single aggregate query (project backlog #6 — previously 6
        ListPayments calls / 12 SQL round-trips, and had a latent bug
        capping paid_amount at the 100 most recent paid payments).
      security: [{ merchantBearer: [] }]
      parameters: [{ name: environment, in: query, schema: { type: string, enum: [sandbox, production] } }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  environment: { type: string }
                  total_payments: { type: integer }
                  paid_payments: { type: integer }
                  pending_payments: { type: integer }
                  failed_payments: { type: integer }
                  expired_payments: { type: integer }
                  refunded_payments: { type: integer }
                  paid_amount: { type: integer }

  /merchant/dashboard/charts:
    get:
      tags: [Merchant Dashboard]
      summary: Daily payment chart for the authenticated merchant
      security: [{ merchantBearer: [] }]
      parameters:
        - { name: environment, in: query, schema: { type: string } }
        - { name: days, in: query, schema: { type: integer, default: 14, maximum: 90 } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/DashboardCharts' } } } }

  /merchant/notifications:
    get:
      tags: [Merchant Dashboard]
      summary: Operational alert feed scoped to this merchant
      security: [{ merchantBearer: [] }]
      parameters: [{ name: environment, in: query, schema: { type: string } }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/NotificationsResponse' } } } }

  /merchant/callbacks:
    get:
      tags: [Merchant Dashboard]
      summary: List this merchant's outbound webhook callback deliveries
      security: [{ merchantBearer: [] }]
      parameters:
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Offset' }
        - { name: status, in: query, schema: { type: string } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/PaginatedCallbacks' } } } }

  /merchant/payments:
    get:
      tags: [Merchant Dashboard]
      summary: List this merchant's payments
      security: [{ merchantBearer: [] }]
      parameters:
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Offset' }
        - { name: status, in: query, schema: { type: string } }
        - { name: search, in: query, schema: { type: string } }
        - { name: environment, in: query, schema: { type: string } }
        - { name: date_from, in: query, schema: { type: string, format: date-time } }
        - { name: date_to, in: query, schema: { type: string, format: date-time } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/PaginatedPayments' } } } }
    post:
      tags: [Merchant Dashboard]
      summary: Create a payment from the dashboard
      description: |
        Supports the optional `Idempotency-Key` header with the same
        semantics as `POST /payments`. A deactivated merchant gets 403.
      security: [{ merchantBearer: [] }]
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        content: { application/json: { schema: { $ref: '#/components/schemas/CreatePaymentRequest' } } }
      responses:
        '201':
          description: Created (or replayed — see `Idempotent-Replayed`)
          headers:
            Idempotent-Replayed: { $ref: '#/components/headers/IdempotentReplayed' }
          content: { application/json: { schema: { $ref: '#/components/schemas/PaymentResponse' } } }
        '400': { description: "Invalid request (including `amount` outside 1..1000000000000) or malformed Idempotency-Key", content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Merchant account is inactive, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '409': { description: A request with this Idempotency-Key is still being processed (retry shortly), content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '422': { description: Idempotency-Key was already used with a different request, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '502': { description: The payment provider answered with an error or an invalid response. No payment was recorded. Retrying with the same Idempotency-Key is safe. }
        '503': { description: "No payment provider is available right now, or the provider could not be reached. No payment was recorded. Retrying with the same Idempotency-Key is safe." }
        '504': { description: The payment provider did not answer in time. No payment was recorded. Retrying with the same Idempotency-Key is safe. }

  /merchant/payments/export:
    get:
      tags: [Merchant Dashboard]
      summary: Export this merchant's payments as CSV
      description: The last two columns are `fee_amount` and `total_amount` (`amount` + `fee_amount`); `amount` stays the merchant nominal.
      security: [{ merchantBearer: [] }]
      responses:
        '200': { description: CSV file, content: { text/csv: { schema: { type: string, format: binary } } } }

  /merchant/payments/{id}:
    get:
      tags: [Merchant Dashboard]
      summary: Get one of this merchant's payments
      security: [{ merchantBearer: [] }]
      parameters: [{ $ref: '#/components/parameters/PathID' }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/PaymentResponse' } } } }
        '404': { description: Not found (also returned if the payment belongs to another merchant) }

  /merchant/api-keys:
    get:
      tags: [Merchant Dashboard]
      summary: List this merchant's API keys
      security: [{ merchantBearer: [] }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/APIKeyPublic' } } } } }
    put:
      tags: [Merchant Dashboard]
      summary: Create/rotate an API key for sandbox or production
      description: |
        Requires admin-password confirmation in the request body even
        though the caller is already merchant-JWT-authenticated. Rate
        limited 10 req/min per IP (project backlog #8) — previously
        unlimited once past JWT auth.
      security: [{ merchantBearer: [] }]
      requestBody:
        content: { application/json: { schema: { $ref: '#/components/schemas/UpsertAPIKeyRequest' } } }
      responses:
        '200': { description: OK — secret shown once, content: { application/json: { schema: { $ref: '#/components/schemas/UpsertAPIKeyResponse' } } } }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    post:
      tags: [Merchant Dashboard]
      summary: Create/rotate an API key
      description: Same as PUT. Rate limited 10 req/min per IP.
      security: [{ merchantBearer: [] }]
      requestBody:
        content: { application/json: { schema: { $ref: '#/components/schemas/UpsertAPIKeyRequest' } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/UpsertAPIKeyResponse' } } } }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /merchant/api-keys/{keyId}:
    delete:
      tags: [Merchant Dashboard]
      summary: Revoke an API key
      description: Rate limited 10 req/min per IP (project backlog #8).
      security: [{ merchantBearer: [] }]
      parameters: [{ name: keyId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: Deleted }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /merchant/business:
    get:
      tags: [Merchant Dashboard]
      summary: Get business profile (merchant record)
      security: [{ merchantBearer: [] }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/MerchantResponse' } } } }
    put:
      tags: [Merchant Dashboard]
      summary: Update business profile
      security: [{ merchantBearer: [] }]
      requestBody:
        content: { application/json: { schema: { $ref: '#/components/schemas/UpdateMerchantRequest' } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/MerchantResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }

  /merchant/webhook-secret:
    get:
      tags: [Merchant Dashboard]
      summary: Get (or lazily generate) the outbound webhook HMAC signing secret
      security: [{ merchantBearer: [] }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { webhook_secret: { type: string } } } } } }

  /merchant/webhook-secret/regenerate:
    post:
      tags: [Merchant Dashboard]
      summary: Rotate the webhook signing secret
      description: |
        Invalidates the previous secret immediately. Rate limited 10
        req/min per IP (project backlog #8) — previously unlimited once
        past JWT auth. Requires the account password (like API key
        rotation) because every callback verifier on the merchant's side
        breaks; reading the secret (`GET /merchant/webhook-secret`) does not.
      security: [{ merchantBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string, description: The merchant user's current password }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { webhook_secret: { type: string } } } } } }
        '400': { description: Invalid body or password missing/blank, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '401': { description: Wrong password (message Invalid password) or missing/invalid token, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  # ---------------------------------------------------------------- Merchant Balance & Payouts
  /merchant/balance:
    get:
      tags: [Merchant Balance & Payouts]
      summary: Balance card for the authenticated merchant
      description: |
        Production money only (sandbox payments never enter the balance).
        `balance` is the sum of the whole ledger, adjustments included; the
        three totals exclude adjustments. `can_request` is true when a payout
        could be requested now (payout account set, no open request, balance
        at least `min_payout_amount`).
      security: [{ merchantBearer: [] }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/MerchantBalance' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /merchant/balance/daily:
    get:
      tags: [Merchant Balance & Payouts]
      summary: Credited and debited ledger amounts per day for the Balance chart
      description: |
        For the authenticated merchant only (the merchant always comes from the
        session). `credited` is the sum of positive ledger entries of the day
        (payment credits, payout reversals, positive adjustments); `debited` is
        the absolute value of the sum of negative entries (refunds, payouts,
        negative adjustments). Days are bucketed by `DATE(created_at)`; days
        without entries are present with zeros.
      security: [{ merchantBearer: [] }]
      parameters:
        - name: days
          in: query
          required: false
          description: Number of days ending today. Values outside 1..90 are clamped; missing or non-numeric means 14.
          schema: { type: integer, default: 14, minimum: 1, maximum: 90 }
      responses:
        '200':
          description: Daily ledger movement
          content:
            application/json:
              schema:
                type: object
                required: [days, daily]
                properties:
                  days: { type: integer, example: 14, description: The effective (clamped) window }
                  daily:
                    type: array
                    description: Exactly `days` points, oldest first
                    items:
                      type: object
                      required: [date, label, credited, debited]
                      properties:
                        date: { type: string, example: '2026-11-10' }
                        label: { type: string, example: '10 Nov' }
                        credited: { type: integer, format: int64 }
                        debited: { type: integer, format: int64 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { description: Failed to load balance chart }

  /merchant/ledger:
    get:
      tags: [Merchant Balance & Payouts]
      summary: Ledger entries of the authenticated merchant, newest first
      description: Admin identifiers (`created_by`) and `merchant_id` are not included.
      security: [{ merchantBearer: [] }]
      parameters:
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Offset' }
      responses:
        '200': { description: "OK (`limit` defaults to 20, capped at 100)", content: { application/json: { schema: { $ref: '#/components/schemas/PaginatedMerchantLedger' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /merchant/payout-account:
    put:
      tags: [Merchant Balance & Payouts]
      summary: Set or change the payout destination (requires the account password)
      description: |
        Re-authenticates with the dashboard password like webhook-secret
        regeneration. A wrong password is a plain 401 `Invalid password`;
        clients must not treat it as an expired session. Payouts keep a
        snapshot of the account at request time, so changing it does not
        affect an already open request. Uses the sensitive rate-limit bucket.
      security: [{ merchantBearer: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/UpdatePayoutAccountRequest' } } }
      responses:
        '200': { description: Saved (normalised values), content: { application/json: { schema: { $ref: '#/components/schemas/PayoutAccount' } } } }
        '400': { description: 'Invalid body, password missing, or bank name / account number / holder invalid', content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '401': { description: 'Missing/invalid token, or `Invalid password`', content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '404': { description: Merchant not found, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /merchant/payouts:
    get:
      tags: [Merchant Balance & Payouts]
      summary: Payout requests of the authenticated merchant
      description: Admin identifiers (`requested_by`, `processed_by`) and `merchant_id` are not included.
      security: [{ merchantBearer: [] }]
      parameters:
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Offset' }
      responses:
        '200': { description: "OK (`limit` defaults to 20, capped at 100)", content: { application/json: { schema: { $ref: '#/components/schemas/PaginatedMerchantPayouts' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    post:
      tags: [Merchant Balance & Payouts]
      summary: Request a payout
      description: |
        The amount is debited from the balance immediately (a `payout_debit`
        ledger row), so the available balance always accounts for the open
        request; a rejection returns it. At most one request per merchant is
        open at a time, which is also what makes a double click safe (no
        `Idempotency-Key` is used). The minimum is the server's
        `payout.min_amount` (50000 in production). Uses the sensitive
        rate-limit bucket.
      security: [{ merchantBearer: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/RequestPayoutRequest' } } }
      responses:
        '201': { description: Requested, content: { application/json: { schema: { $ref: '#/components/schemas/MerchantPayout' } } } }
        '400': { description: Invalid body or amount below the minimum payout, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: Merchant not found, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '409': { description: A payout request is already waiting to be processed, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '422': { description: 'Insufficient balance, or no payout account set', content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  # ---------------------------------------------------------------- Merchant Payment Links
  /merchant/payment-links:
    get:
      tags: [Merchant Payment Links]
      summary: List this merchant's payment links
      security: [{ merchantBearer: [] }]
      parameters:
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Offset' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/PaymentLinkResponse' } }
                  total: { type: integer }
    post:
      tags: [Merchant Payment Links]
      summary: Create a payment link
      security: [{ merchantBearer: [] }]
      requestBody:
        content: { application/json: { schema: { $ref: '#/components/schemas/CreatePaymentLinkRequest' } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/PaymentLinkResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }

  /merchant/payment-links/stats:
    get:
      tags: [Merchant Payment Links]
      summary: Summary of this merchant's payment links for the Payment Links page
      description: |
        For the authenticated merchant only (the merchant always comes from the
        session). The whole response is scoped to the requested `environment`: link
        counts cover only the merchant's links of that environment, and
        `paid_count`, `paid_amount` and `daily` count payments with status `paid` that were
        spawned by one of the merchant's links in the requested `environment`
        (daily by `DATE(paid_at)` for the last 14 days, empty days are zero).
        Amounts are IDR integers.
      security: [{ merchantBearer: [] }]
      parameters:
        - name: environment
          in: query
          required: false
          description: Payment environment; empty or unknown values mean `production` (same as the other merchant endpoints).
          schema: { type: string, enum: [sandbox, production], default: production }
      responses:
        '200':
          description: Payment link statistics
          content:
            application/json:
              schema:
                type: object
                required: [days, total, active, inactive, fixed, open, paid_count, paid_amount, daily, breakdown]
                properties:
                  days: { type: integer, example: 14 }
                  total: { type: integer, format: int64 }
                  active: { type: integer, format: int64 }
                  inactive: { type: integer, format: int64 }
                  fixed: { type: integer, format: int64 }
                  open: { type: integer, format: int64 }
                  paid_count: { type: integer, format: int64 }
                  paid_amount: { type: integer, format: int64 }
                  daily:
                    type: array
                    description: Exactly 14 points, oldest first; days without paid link payments are zero
                    items:
                      type: object
                      required: [date, label, paid_count, paid_amount]
                      properties:
                        date: { type: string, example: '2026-11-10' }
                        label: { type: string, example: '10 Nov' }
                        paid_count: { type: integer, format: int64 }
                        paid_amount: { type: integer, format: int64 }
                  breakdown:
                    type: array
                    description: '`active` / `inactive` link counts; entries with a zero count are omitted (empty array when the merchant has no links)'
                    items:
                      type: object
                      required: [status, count]
                      properties:
                        status: { type: string, enum: [active, inactive] }
                        count: { type: integer, format: int64 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { description: Failed to load payment link stats }

  /merchant/payment-links/{id}:
    get:
      tags: [Merchant Payment Links]
      summary: Get a payment link
      security: [{ merchantBearer: [] }]
      parameters: [{ $ref: '#/components/parameters/PathID' }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/PaymentLinkResponse' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Merchant Payment Links]
      summary: Update a payment link
      description: amount_type/amount are immutable after creation — deactivate and create a new link instead.
      security: [{ merchantBearer: [] }]
      parameters: [{ $ref: '#/components/parameters/PathID' }]
      requestBody:
        content: { application/json: { schema: { $ref: '#/components/schemas/UpdatePaymentLinkRequest' } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/PaymentLinkResponse' } } } }

  /merchant/payment-links/{id}/status:
    put:
      tags: [Merchant Payment Links]
      summary: Activate/deactivate a payment link
      security: [{ merchantBearer: [] }]
      parameters: [{ $ref: '#/components/parameters/PathID' }]
      requestBody:
        content: { application/json: { schema: { type: object, properties: { is_active: { type: boolean } } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/PaymentLinkResponse' } } } }

  /merchant/payment-links/{id}/payments:
    get:
      tags: [Merchant Payment Links]
      summary: List payments spawned by this link
      description: Items are the raw payment records and also carry `merchant_net_amount` (what the merchant keeps once paid; stored for every paid payment, but only production payments are credited to the ledger; 0 for payments that are not paid). No other payment response exposes it to merchants.
      security: [{ merchantBearer: [] }]
      parameters:
        - { $ref: '#/components/parameters/PathID' }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Offset' }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/PaginatedPayments' } } } }

  # ---------------------------------------------------------------- Public
  /public/payments/by-reference/{reference}:
    get:
      tags: [Public]
      summary: Get a payment by reference (checkout page polling)
      description: |
        No auth. Rate limited 120 req/min per IP. Returns only checkout-safe fields.
        Includes `amount` (merchant nominal), `fee_amount` (provider fee borne by
        the customer, 0 when the merchant bears it) and `total_amount`
        (`amount` + `fee_amount`, what the customer pays). The checkout page shows `total_amount`.
        `merchant_name` is the merchant's business name (falling back to its name; empty
        string when unknown), shown in the checkout header. Display only.
      parameters: [{ name: reference, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: "OK (fields include id, reference, merchant_name, amount, fee_amount, total_amount, currency, status)" }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /public/payment-links/{slug}:
    get:
      tags: [Public]
      summary: Resolve a public payment link
      description: No auth. Rate limited 120 req/min per IP.
      parameters: [{ name: slug, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/PublicPaymentLinkResponse' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /public/payment-links/{slug}/pay:
    post:
      tags: [Public]
      summary: Check out through a payment link
      description: |
        No auth. Rate limited 120 req/min per IP. Spawns a fresh one-time
        Payment linked back to this Payment Link (see
        PaymentLinkService). `amount` is only honored for open-amount
        links — for fixed links it is ignored server-side.
      parameters: [{ name: slug, in: path, required: true, schema: { type: string } }]
      requestBody:
        content: { application/json: { schema: { $ref: '#/components/schemas/InitiateCheckoutRequest' } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/PaymentResponse' } } } }
        '400': { description: 'Invalid request, including an open-link `amount` outside 1..1000000000000', content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '502': { description: The payment provider answered with an error or an invalid response. No payment was recorded. }
        '503': { description: "No payment provider is available right now, or the provider could not be reached. No payment was recorded." }
        '504': { description: The payment provider did not answer in time. No payment was recorded. }

  # ---------------------------------------------------------------- Merchant API (API key)
  /payments:
    post:
      tags: [Merchant API]
      summary: Create a payment (server-to-server)
      description: |
        `merchant_id` and `environment` in the request body are ignored —
        forced from the authenticated API key
        (see MerchantAPIAuthMiddleware) so a caller can never forge
        another merchant's ID.

        Supports the optional `Idempotency-Key` header (see the parameter):
        retrying with the same key never creates a second payment. A replay
        returns 201 with the payment's current state and
        `Idempotent-Replayed: true`. Payment-link checkout and admin payment
        creation do not use idempotency keys.

        Rate limited by the `[rate_limit.api]` bucket (default 120 req/min
        per IP), separate from the bucket shared by the GET endpoints.
      security: [{ apiKey: [] }]
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        content: { application/json: { schema: { $ref: '#/components/schemas/CreatePaymentRequest' } } }
      responses:
        '201':
          description: Created (or replayed — see `Idempotent-Replayed`)
          headers:
            Idempotent-Replayed: { $ref: '#/components/headers/IdempotentReplayed' }
          content: { application/json: { schema: { $ref: '#/components/schemas/PaymentResponse' } } }
        '400': { description: "Invalid request (including `amount` outside 1..1000000000000) or malformed Idempotency-Key", content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '401': { description: Missing/invalid/revoked API key }
        '403': { description: Merchant inactive (rejected at authentication and again on creation) }
        '409': { description: A request with this Idempotency-Key is still being processed (retry shortly), content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '422': { description: Idempotency-Key was already used with a different request, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '502': { description: The payment provider answered with an error or an invalid response. No payment was recorded. Retrying with the same Idempotency-Key is safe. }
        '503': { description: "No payment provider is available right now, or the provider could not be reached. No payment was recorded. Retrying with the same Idempotency-Key is safe." }
        '504': { description: The payment provider did not answer in time. No payment was recorded. Retrying with the same Idempotency-Key is safe. }
        '429': { $ref: '#/components/responses/TooManyRequests' }
      callbacks:
        paymentStatusChanged:
          '{$request.body#/callback_url}':
            post:
              summary: Payment status change notification (also sent to the merchant `webhook_url`)
              description: |
                Events: `payment.paid`, `payment.expired`, `payment.failed`,
                `payment.cancelled` and `payment.refunded` (full refunds only).
              requestBody:
                content: { application/json: { schema: { $ref: '#/components/schemas/PaymentCallbackPayload' } } }
              responses:
                '2XX': { description: Any 2xx marks the delivery successful; other results are retried (up to 5 attempts) }

  /payments/{id}:
    get:
      tags: [Merchant API]
      summary: Get a payment (server-to-server)
      security: [{ apiKey: [] }]
      parameters: [{ $ref: '#/components/parameters/PathID' }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/PaymentResponse' } } } }
        '404': { $ref: '#/components/responses/NotFound' }

  /payments/{id}/status:
    get:
      tags: [Merchant API]
      summary: Get a payment's status (lightweight polling endpoint)
      security: [{ apiKey: [] }]
      parameters: [{ $ref: '#/components/parameters/PathID' }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/PaymentStatusResponse' } } } }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------------------------------------------------------- Webhooks
  /provider-webhooks/{providerName}:
    post:
      tags: [Webhooks]
      summary: Inbound webhook from a payment provider (e.g. Cashi)
      description: |
        No auth — signature-verified per provider adapter (`x-gateway-signature`,
        HMAC-SHA256 of the raw body). A webhook only triggers processing: the
        payment is marked paid after the provider's check-status confirms it is
        settled and its gross amount equals the stored amount (see
        docs/payment-state-machine.md). Duplicates, non-settlement events,
        already-final payments and amount mismatches respond 200
        `{"status":"ignored"}`; if the provider cannot confirm the settlement
        yet the response is 502 so the provider may retry (the reconcile job
        is the fallback). A webhook for a payment owned by a different
        provider than the one in the path is rejected with 400 before any
        check-status call. Rate limited 120 req/min per IP.
      parameters: [{ name: providerName, in: path, required: true, schema: { type: string } }]
      requestBody:
        content: { application/json: { schema: { type: object } } }
      responses:
        '200': { description: "Processed, or acknowledged without a status change (ignored)" }
        '400': { description: Invalid payload / signature validation failed / unregistered provider / unknown order / provider does not own the payment }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '502': { description: Settlement not yet confirmed by the provider — retry later }

  # ---------------------------------------------------------------- Health
  /health:
    get:
      tags: [Health]
      summary: Readiness check
      description: 'readiness: database ping, 2s deadline'
      responses:
        '200':
          description: Database answered the ping
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthStatus' }
              example: { status: ok }
        '503':
          description: Database did not answer within the deadline
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthStatus' }
              example: { status: unavailable }

components:
  securitySchemes:
    adminBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Admin session token from POST /auth/admin/login.
    merchantBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Merchant dashboard session token from POST /auth/login.
    apiKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: |
        Merchant API key. Accepted either as `X-API-Key: <key>` or
        `Authorization: Bearer <key>` (see MerchantAPIAuthMiddleware).

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        Optional. 1-128 visible ASCII characters (0x21-0x7E). Scoped per
        merchant + environment and remembered for 24 hours. Use a fresh UUID
        per payment intent and resend the same key when retrying.

        - Same key, same request: no second payment is created; the response
          is the payment's CURRENT state (it may have moved on from pending)
          with `Idempotent-Replayed: true`.
        - Same key while the first request is still being processed: 409
          (retry shortly). A claim that never produced a payment is treated
          as abandoned after 2 minutes.
        - Same key with a different request body: 422.
        - Malformed key: 400.
      schema: { type: string, minLength: 1, maxLength: 128 }
    PathID:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    Limit:
      name: limit
      in: query
      schema: { type: integer, default: 20 }
    Offset:
      name: offset
      in: query
      schema: { type: integer, default: 0 }

  headers:
    IdempotentReplayed:
      description: Present with value `true` when the response is a replay of an earlier request that used the same `Idempotency-Key`.
      schema: { type: string, enum: ['true'] }

  responses:
    BadRequest:
      description: Invalid request
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    Unauthorized:
      description: Missing or invalid authorization (including a token revoked by logout/password change, or an inactive account; message "Invalid or expired token")
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    NotFound:
      description: Not found
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    Conflict:
      description: Conflict (e.g. the payout was already processed)
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    PayloadTooLarge:
      description: Request body exceeds the 1 MiB limit
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    TooManyRequests:
      description: Rate limit exceeded (per-IP)
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }

  schemas:
    ErrorResponse:
      type: object
      properties:
        error: { type: string }
        message: { type: string }

    # ---- Auth ----
    UserLoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }
    UserLoginResponse:
      type: object
      properties:
        token: { type: string }
        token_type: { type: string, example: Bearer }
        expires_in: { type: integer, description: Seconds until expiry }
        user: { $ref: '#/components/schemas/UserResponse' }
    UserResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        merchant_id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string }
        role: { type: string }
        is_active: { type: boolean }
        last_login_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        business_name: { type: string }
        webhook_url: { type: string, nullable: true }
    RegisterRequest:
      type: object
      required: [name, business_name, email, password]
      properties:
        name: { type: string, maxLength: 150 }
        business_name: { type: string, maxLength: 255 }
        email: { type: string, format: email, maxLength: 255 }
        phone: { type: string, maxLength: 50 }
        password: { type: string, minLength: 8, maxLength: 72 }
    RegisteredMerchant:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string }
        phone: { type: string }
        business_name: { type: string }
        webhook_url: { type: string, nullable: true }
        is_active: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    AdminLoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }
    AdminLoginResponse:
      type: object
      properties:
        token: { type: string }
        token_type: { type: string, example: Bearer }
        expires_in: { type: integer }
        admin: { $ref: '#/components/schemas/AdminResponse' }
    AdminResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string }
        is_active: { type: boolean }
        last_login_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    # ---- Payment ----
    CreatePaymentRequest:
      type: object
      required: [amount, payment_method, description]
      properties:
        merchant_id: { type: string, format: uuid, description: Forced from context on merchant-authenticated routes }
        amount: { type: integer, minimum: 1, maximum: 1000000000000, description: 'Merchant nominal; values outside 1..1000000000000 are rejected with 400. If the merchant has fee_bearer customer, the customer pays amount + fee_amount (see total_amount in the response).' }
        currency: { type: string, default: IDR }
        payment_method: { type: string, enum: [qris] }
        description: { type: string }
        customer_name: { type: string, nullable: true }
        customer_email: { type: string, nullable: true }
        callback_url:
          type: string
          nullable: true
          description: |
            URL notified when the payment changes status. Must have a public host:
            `localhost`, private, loopback, link-local or cloud-metadata addresses and
            embedded credentials (`user:password@`) are rejected with 400 in every
            environment. Production payments require `https`; sandbox payments also
            allow plain `http` (sandbox relaxes only the scheme, not the host rules).
            Only this per-payment URL may be plain `http` (sandbox); the merchant
            `webhook_url` is always `https`. Our own API and frontend domains
            (and their subdomains) are rejected too.
            The destination address is checked again when the callback is sent.
            Redirects (3xx) are not followed and count as a failed delivery, so
            register the final URL. Delivery is at-least-once: the same callback can
            arrive more than once, so de-duplicate on (`payment_id`, `event`).
        expires_in_minutes: { type: integer, minimum: 1, maximum: 1440, default: 30 }
        environment: { type: string, example: sandbox, description: 'sandbox | production (aliases: prod, live / test, dev, development). Empty means sandbox; any other value is rejected with 400.' }
        use_custom_merchant_name:
          type: boolean
          description: Requests a custom merchant display name on the QR (provider-dependent, e.g. Cashi QRIS Custom).
    PaymentResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        reference: { type: string }
        merchant_id: { type: string, format: uuid }
        amount: { type: integer, description: Merchant nominal }
        fee_amount: { type: integer, description: 'Provider fee added on top of `amount`; 0 unless the merchant has `fee_bearer: customer`.' }
        total_amount: { type: integer, description: 'What the customer pays: `amount` + `fee_amount`. `amount` is always the merchant nominal.' }
        currency: { type: string }
        payment_method: { type: string }
        provider_name: { type: string }
        provider_reference: { type: string, nullable: true }
        status: { type: string, enum: [pending, paid, expired, failed, cancelled, refunded] }
        description: { type: string }
        customer_name: { type: string, nullable: true }
        customer_email: { type: string, nullable: true }
        qris_data: { type: string, nullable: true }
        checkout_url: { type: string }
        environment: { type: string }
        payment_link_id: { type: string, format: uuid, nullable: true }
        expires_at: { type: string, format: date-time }
        paid_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    PaymentStatusResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        reference: { type: string }
        status: { type: string, enum: [pending, paid, expired, failed, cancelled, refunded] }
        amount: { type: integer, description: Merchant nominal }
        fee_amount: { type: integer, description: 'Provider fee added on top of `amount`; 0 unless the merchant has `fee_bearer: customer`.' }
        total_amount: { type: integer, description: 'What the customer pays: `amount` + `fee_amount`. `amount` is always the merchant nominal.' }
        currency: { type: string }
        paid_at: { type: string, format: date-time, nullable: true }
        expires_at: { type: string, format: date-time }

    AdminPaymentItem:
      type: object
      properties:
        id: { type: string, format: uuid }
        reference: { type: string }
        merchant_id: { type: string, format: uuid }
        merchant_name: { type: string }
        amount: { type: integer, description: Merchant nominal }
        fee_amount: { type: integer, description: 'Provider fee added on top of `amount`; 0 unless the merchant has `fee_bearer: customer`.' }
        total_amount: { type: integer, description: 'What the customer pays: `amount` + `fee_amount`. `amount` is always the merchant nominal.' }
        currency: { type: string }
        payment_method: { type: string }
        provider_name: { type: string }
        provider_reference: { type: string, nullable: true }
        status: { type: string, enum: [pending, paid, expired, failed, cancelled, refunded] }
        description: { type: string }
        customer_name: { type: string, nullable: true }
        customer_email: { type: string, nullable: true }
        environment: { type: string }
        expires_at: { type: string, format: date-time }
        paid_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    AdminPaymentDetail:
      allOf:
        - $ref: '#/components/schemas/AdminPaymentItem'
        - type: object
          properties:
            qris_data: { type: string, nullable: true }
            callback_url: { type: string, nullable: true }
    PaginatedPayments:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/AdminPaymentItem' } }
        total: { type: integer }
        limit: { type: integer }
        offset: { type: integer }

    ReconcileResult:
      type: object
      properties:
        payment_id: { type: string, format: uuid }
        reference: { type: string }
        previous_status: { type: string }
        current_status: { type: string }
        provider_status: { type: string, nullable: true }
        action: { type: string, enum: [updated, unchanged, expired_local, skipped, error] }
        message: { type: string }
        merchant_notified:
          type: boolean
          description: |
            True when a merchant callback was queued for this change (a delivery row
            was recorded). It does not mean the merchant has received it yet: the
            delivery worker sends it shortly after.

    # ---- Merchant ----
    CreateMerchantRequest:
      type: object
      required: [name, email, business_name, password]
      properties:
        name: { type: string }
        email: { type: string, format: email }
        phone: { type: string }
        business_name: { type: string }
        password:
          type: string
          format: password
          writeOnly: true
          minLength: 8
          maxLength: 72
          description: Initial password of the merchant owner login account (max 72 bytes). Never returned.
        webhook_url:
          type: string
          nullable: true
          description: |
            URL that receives payment callbacks. Always `https` (in every environment), with a public host;
            our own API and frontend domains (and their subdomains) are rejected too:
            `http`, embedded credentials (`user:password@`), `localhost`, and private,
            loopback, link-local or cloud-metadata addresses are rejected with 400.
            The destination address is checked again when a callback is sent.
            Redirects (3xx) are not followed and count as a failed delivery, so
            register the final URL. Delivery is at-least-once: the same callback can
            arrive more than once, so de-duplicate on (`payment_id`, `event`).
    UpdateMerchantRequest:
      type: object
      properties:
        name: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        business_name: { type: string, nullable: true }
        webhook_url:
          type: string
          nullable: true
          description: |
            URL that receives payment callbacks. Always `https` (in every environment), with a public host;
            our own API and frontend domains (and their subdomains) are rejected too:
            `http`, embedded credentials (`user:password@`), `localhost`, and private,
            loopback, link-local or cloud-metadata addresses are rejected with 400.
            The destination address is checked again when a callback is sent.
            Redirects (3xx) are not followed and count as a failed delivery, so
            register the final URL. Delivery is at-least-once: the same callback can
            arrive more than once, so de-duplicate on (`payment_id`, `event`).
            The callback payload carries `amount` (merchant nominal), `fee_amount`
            (0 unless the customer bears the provider fee) and `total_amount`
            (`amount` + `fee_amount`, what the customer paid).
    MerchantResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string }
        phone: { type: string }
        business_name: { type: string }
        webhook_url: { type: string, nullable: true }
        is_active: { type: boolean }
        fee_bearer:
          type: string
          enum: [merchant, customer]
          readOnly: true
          description: |
            Who pays the provider's percentage fee (default `merchant`). With `customer` the
            fee is added on top of new payments (`total_amount` = `amount` + `fee_amount`).
            Changed only by an admin via `PUT /admin/merchants/{id}/fee-bearer`; merchants cannot edit it.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    PaginatedMerchants:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/MerchantResponse' } }
        total: { type: integer }
        limit: { type: integer }
        offset: { type: integer }

    # ---- API Keys ----
    APIKeyPublic:
      type: object
      properties:
        id: { type: string, format: uuid }
        merchant_id: { type: string, format: uuid }
        name: { type: string, description: 'Environment alias: sandbox | production' }
        key_prefix: { type: string }
        is_active: { type: boolean }
        last_used_at: { type: string, format: date-time, nullable: true }
        revoked_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    UpsertAPIKeyRequest:
      type: object
      required: [environment, password]
      properties:
        environment: { type: string, enum: [sandbox, production] }
        password: { type: string, description: Admin/account password confirmation required for this destructive action }
    UpsertAPIKeyResponse:
      type: object
      properties:
        key: { $ref: '#/components/schemas/APIKeyPublic' }
        secret: { type: string, description: Shown once — not retrievable again }
        hint: { type: string }
        rotated: { type: boolean }
        environment: { type: string }

    # ---- Provider / Routing ----
    ProviderInfo:
      type: object
      properties:
        name: { type: string }
        payment_methods: { type: array, items: { type: string } }
        health: { $ref: '#/components/schemas/ProviderHealth' }
        is_registered: { type: boolean }
    HealthStatus:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ok, unavailable] }
    ProviderHealth:
      type: object
      properties:
        provider_name: { type: string }
        status: { type: string, enum: [healthy, degraded, unhealthy] }
        reason: { type: string }
        updated_at: { type: string, format: date-time }
    ProviderDetail:
      type: object
      properties:
        provider: { $ref: '#/components/schemas/ProviderInfo' }
        merchant_count: { type: integer }
        merchant_routes: { type: array, items: { $ref: '#/components/schemas/RoutingItem' } }
    UpdateProviderHealthRequest:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [healthy, degraded, unhealthy] }
        reason: { type: string }
    MerchantProviderConfig:
      type: object
      properties:
        id: { type: string, format: uuid }
        merchant_id: { type: string, format: uuid }
        provider_name: { type: string }
        payment_method: { type: string }
        priority: { type: integer }
        weight: { type: integer }
        failover_enabled: { type: boolean }
        is_enabled: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    UpsertMerchantProviderConfigRequest:
      type: object
      required: [provider_name, payment_method]
      properties:
        provider_name: { type: string }
        payment_method: { type: string }
        priority: { type: integer, default: 1 }
        weight: { type: integer, default: 100 }
        failover_enabled: { type: boolean }
        is_enabled: { type: boolean }
    RoutingItem:
      type: object
      properties:
        id: { type: string, format: uuid }
        merchant_id: { type: string, format: uuid }
        merchant_name: { type: string }
        merchant_email: { type: string }
        provider_name: { type: string }
        payment_method: { type: string }
        priority: { type: integer }
        weight: { type: integer }
        failover_enabled: { type: boolean }
        is_enabled: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    PaginatedRouting:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/RoutingItem' } }
        total: { type: integer }
        limit: { type: integer }
        offset: { type: integer }

    # ---- Reconciliation ----
    ReconciliationItem:
      type: object
      properties:
        payment_id: { type: string, format: uuid }
        reference: { type: string }
        merchant_name: { type: string }
        provider_name: { type: string }
        provider_reference: { type: string, nullable: true }
        status: { type: string }
        amount: { type: integer }
        currency: { type: string }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        check_status: { type: string, enum: [pending_review, possibly_expired, missing_provider_ref] }
        note: { type: string }
    ReconciliationResponse:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/ReconciliationItem' } }
        total: { type: integer }
        message: { type: string }

    # ---- Dashboard ----
    DashboardSummary:
      type: object
      properties:
        total_payments: { type: integer }
        pending_payments: { type: integer }
        paid_payments: { type: integer }
        expired_payments: { type: integer }
        failed_payments: { type: integer }
        refunded_payments: { type: integer }
        total_merchants: { type: integer }
        paid_amount: { type: integer }
        webhook_events: { type: integer }
    DashboardDailyPoint:
      type: object
      properties:
        date: { type: string, format: date }
        label: { type: string }
        total: { type: integer }
        paid: { type: integer }
        pending: { type: integer }
        failed: { type: integer }
        expired: { type: integer }
        cancelled: { type: integer }
        refunded: { type: integer }
        paid_amount: { type: integer, description: 'Fully refunded payments (`refunded`) are not counted; a partially refunded payment stays `paid` at its full amount.' }
    DashboardStatusPoint:
      type: object
      properties:
        status: { type: string, description: 'pending, paid, expired, failed, cancelled or refunded' }
        count: { type: integer }
    DashboardCharts:
      type: object
      properties:
        days: { type: integer }
        daily: { type: array, items: { $ref: '#/components/schemas/DashboardDailyPoint' } }
        status_breakdown: { type: array, items: { $ref: '#/components/schemas/DashboardStatusPoint' } }

    # ---- Notifications ----
    AdminNotification:
      type: object
      properties:
        id: { type: string }
        kind: { type: string, enum: [webhook_error, webhook_pending, payment_failed, payment_expired, payout_requested, info], description: '`payout_requested` appears in the admin feed only, with `href` /admin/payouts, while payout requests are waiting.' }
        title: { type: string }
        body: { type: string }
        created_at: { type: string, format: date-time }
        href: { type: string }
        attention: { type: boolean, description: Counts toward the notification badge }
    NotificationsResponse:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/AdminNotification' } }
        attention_count: { type: integer }
        total: { type: integer }

    # ---- Logs ----
    AdminLogItem:
      type: object
      properties:
        id: { type: string, format: uuid }
        payment_id: { type: string, format: uuid, nullable: true }
        provider_name: { type: string }
        provider_reference: { type: string }
        event_type: { type: string }
        status: { type: string }
        is_processed: { type: boolean }
        processing_error: { type: string, nullable: true }
        processed_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
    AdminLogDetail:
      allOf:
        - $ref: '#/components/schemas/AdminLogItem'
        - type: object
          properties:
            raw_payload:
              type: object
              description: Secret-looking keys (secret/password/api_key/authorization/signature/token) are redacted.
    PaginatedLogs:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/AdminLogItem' } }
        total: { type: integer }
        limit: { type: integer }
        offset: { type: integer }

    # ---- Callbacks ----
    AdminCallbackItem:
      type: object
      properties:
        id: { type: string, format: uuid }
        payment_id: { type: string, format: uuid }
        payment_reference: { type: string }
        merchant_id: { type: string, format: uuid }
        merchant_name: { type: string }
        event_type: { type: string }
        target_url: { type: string }
        request_payload: { type: object }
        attempt_number: { type: integer }
        status:
          type: string
          enum: [pending, sending, success, failed, skipped]
          description: |
            `pending` queued, `sending` claimed by the delivery worker (or a manual
            retry in flight), `success`/`failed` final for this attempt (a failed one
            may have `next_retry_at`), `skipped` set only by an operator cleanup.
        http_status: { type: integer, nullable: true }
        response_body: { type: string, nullable: true }
        error_message: { type: string, nullable: true }
        delivered_at: { type: string, format: date-time, nullable: true }
        next_retry_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    PaginatedCallbacks:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/AdminCallbackItem' } }
        total: { type: integer }
        limit: { type: integer }
        offset: { type: integer }

    # ---- Balance, payouts, refunds ----
    PayoutAccount:
      type: object
      properties:
        bank_name: { type: string }
        account_number: { type: string }
        account_holder: { type: string }
    UpdatePayoutAccountRequest:
      type: object
      required: [password, bank_name, account_number, account_holder]
      properties:
        password: { type: string, description: The dashboard account password }
        bank_name: { type: string }
        account_number: { type: string, description: 5-30 digits }
        account_holder: { type: string }
    RequestPayoutRequest:
      type: object
      required: [amount]
      properties:
        amount: { type: integer, description: 'Rupiah; at least the minimum payout and at most the balance.' }
    MerchantBalance:
      type: object
      properties:
        balance: { type: integer, description: 'Sum of the whole ledger (adjustments included); may be negative.' }
        total_credited: { type: integer }
        total_paid_out: { type: integer, description: "Payouts that are requested or paid, net of reversals (rejected payouts)." }
        total_refunded: { type: integer }
        min_payout_amount: { type: integer }
        payout_account:
          nullable: true
          allOf: [{ $ref: '#/components/schemas/PayoutAccount' }]
        can_request: { type: boolean }
    LedgerEntryType:
      type: string
      enum: [payment_credit, refund_debit, payout_debit, payout_reversal, adjustment]
      description: Credits are positive, debits negative; `adjustment` can be either.
    MerchantLedgerEntry:
      type: object
      description: Merchant view. No admin identifiers and no `merchant_id`.
      properties:
        id: { type: string, format: uuid }
        entry_type: { $ref: '#/components/schemas/LedgerEntryType' }
        amount: { type: integer, description: Signed rupiah }
        payment_id: { type: string, format: uuid }
        payout_id: { type: string, format: uuid }
        refund_id: { type: string, format: uuid }
        note: { type: string }
        created_at: { type: string, format: date-time }
    AdminLedgerEntry:
      type: object
      description: Admin view; adds `merchant_id` and `created_by` (admin or user id; absent for system rows such as backfill and payment credits).
      properties:
        id: { type: string, format: uuid }
        merchant_id: { type: string, format: uuid }
        entry_type: { $ref: '#/components/schemas/LedgerEntryType' }
        amount: { type: integer, description: Signed rupiah }
        payment_id: { type: string, format: uuid }
        payout_id: { type: string, format: uuid }
        refund_id: { type: string, format: uuid }
        note: { type: string }
        created_by: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
    PayoutStatus:
      type: string
      enum: [requested, paid, rejected]
    MerchantPayout:
      type: object
      description: Merchant view. No `merchant_id`, `requested_by` or `processed_by`. The bank fields are a snapshot taken at request time.
      properties:
        id: { type: string, format: uuid }
        amount: { type: integer }
        status: { $ref: '#/components/schemas/PayoutStatus' }
        bank_name: { type: string }
        account_number: { type: string }
        account_holder: { type: string }
        requested_at: { type: string, format: date-time }
        processed_at: { type: string, format: date-time }
        reference: { type: string, description: "Transfer reference; present when `paid`" }
        reject_reason: { type: string, description: "Present when `rejected`" }
    AdminPayout:
      type: object
      description: Admin view; adds ids and, in listings, `merchant_name`.
      properties:
        id: { type: string, format: uuid }
        merchant_id: { type: string, format: uuid }
        merchant_name: { type: string, description: Only in GET /admin/payouts }
        amount: { type: integer }
        status: { $ref: '#/components/schemas/PayoutStatus' }
        bank_name: { type: string }
        account_number: { type: string }
        account_holder: { type: string }
        requested_by: { type: string, format: uuid }
        requested_at: { type: string, format: date-time }
        processed_by: { type: string, format: uuid }
        processed_at: { type: string, format: date-time }
        reference: { type: string }
        reject_reason: { type: string }
    PayPayoutRequest:
      type: object
      required: [reference]
      properties:
        reference: { type: string, maxLength: 200, description: Bank transfer reference }
    RejectPayoutRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string, maxLength: 500 }
    AdminMerchantBalance:
      type: object
      properties:
        merchant_id: { type: string, format: uuid }
        merchant_name: { type: string }
        balance: { type: integer }
        open_payout_id: { type: string, format: uuid }
        open_payout_amount: { type: integer, description: 0 when there is no open request }
    RefundRequest:
      type: object
      required: [amount, reason]
      properties:
        amount: { type: integer, minimum: 1, description: 'Part of the merchant net to take back; at most the net not yet refunded.' }
        reason: { type: string, maxLength: 500 }
    AdjustmentRequest:
      type: object
      required: [amount, reason]
      properties:
        amount: { type: integer, description: 'Non-zero signed rupiah, absolute value at most 1000000000000.' }
        reason: { type: string, maxLength: 500 }
    Refund:
      type: object
      properties:
        id: { type: string, format: uuid }
        payment_id: { type: string, format: uuid }
        merchant_id: { type: string, format: uuid }
        amount: { type: integer }
        reason: { type: string }
        created_by: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
    RefundResponse:
      type: object
      properties:
        refund: { $ref: '#/components/schemas/Refund' }
        payment_status: { type: string, enum: [paid, refunded], description: '`refunded` when this refund completed the net.' }
        remaining_refundable: { type: integer }
    RefundItem:
      type: object
      properties:
        id: { type: string, format: uuid }
        amount: { type: integer }
        reason: { type: string }
        created_at: { type: string, format: date-time }
    RefundSummary:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/RefundItem' } }
        merchant_net_amount: { type: integer, description: What the merchant kept from this payment; the refund ceiling. }
        refunded_amount: { type: integer }
        remaining_refundable: { type: integer }
        refundable: { type: boolean }
    PaginatedAdminBalances:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/AdminMerchantBalance' } }
        total: { type: integer }
        limit: { type: integer }
        offset: { type: integer }
    PaginatedAdminPayouts:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/AdminPayout' } }
        total: { type: integer }
        limit: { type: integer }
        offset: { type: integer }
    PaginatedAdminLedger:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/AdminLedgerEntry' } }
        total: { type: integer }
        limit: { type: integer }
        offset: { type: integer }
    PaginatedMerchantLedger:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/MerchantLedgerEntry' } }
        total: { type: integer }
        limit: { type: integer }
        offset: { type: integer }
    PaginatedMerchantPayouts:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/MerchantPayout' } }
        total: { type: integer }
        limit: { type: integer }
        offset: { type: integer }

    # ---- Merchant callback payload ----
    PaymentCallbackPayload:
      type: object
      description: |
        Body POSTed to the payment's `callback_url` (or the merchant
        `webhook_url`). Headers: `X-PG-Event` (same value as `event`) and
        `X-PG-Signature` (HMAC-SHA256 of the raw body with the merchant
        webhook secret). Delivery is at-least-once; de-duplicate on
        (`payment_id`, `event`).

        `payment.refunded` is sent only when a payment becomes fully refunded
        (never for a partial refund). Its payload carries the ORIGINAL payment
        amounts (`amount`, `fee_amount`, `total_amount`) and `status:
        refunded`; refund details (refunded amount, reason) are not included.
        A refunded payment never changes status again.
      properties:
        event: { type: string, enum: [payment.paid, payment.expired, payment.failed, payment.cancelled, payment.refunded] }
        payment_id: { type: string, format: uuid }
        reference: { type: string }
        status: { type: string, enum: [paid, expired, failed, cancelled, refunded] }
        amount: { type: integer, description: Merchant nominal }
        fee_amount: { type: integer }
        total_amount: { type: integer }
        currency: { type: string }
        merchant_id: { type: string, format: uuid }
        provider: { type: string }
        provider_reference: { type: string }
        paid_at: { type: string, format: date-time, description: Kept on `payment.refunded` }
        occurred_at: { type: string, format: date-time }
        late_payment: { type: boolean }

    # ---- Payment Links ----
    CreatePaymentLinkRequest:
      type: object
      required: [merchant_id, title, amount_type]
      properties:
        merchant_id: { type: string, format: uuid }
        title: { type: string }
        description: { type: string }
        amount_type: { type: string, enum: [fixed, open] }
        amount: { type: integer, nullable: true, description: Required for fixed, forbidden for open }
        currency: { type: string, default: IDR }
        min_amount: { type: integer, nullable: true }
        max_amount: { type: integer, nullable: true }
        expires_at: { type: string, format: date-time, nullable: true }
        environment: { type: string, example: sandbox, description: 'sandbox | production (aliases: prod, live / test, dev, development). Empty means sandbox; any other value is rejected with 400.' }
    UpdatePaymentLinkRequest:
      type: object
      description: amount_type/amount are immutable and not editable here.
      properties:
        title: { type: string, nullable: true }
        description: { type: string, nullable: true }
        is_active: { type: boolean, nullable: true }
        expires_at: { type: string, format: date-time, nullable: true }
        min_amount: { type: integer, nullable: true }
        max_amount: { type: integer, nullable: true }
    InitiateCheckoutRequest:
      type: object
      description: amount is only honored for open-amount links.
      properties:
        amount: { type: integer, maximum: 1000000000000, description: 'Open-amount links only; at most 1000000000000 (400 otherwise).' }
        customer_name: { type: string, nullable: true }
        customer_email: { type: string, nullable: true }
    PaymentLinkResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        merchant_id: { type: string, format: uuid }
        slug: { type: string }
        public_url: { type: string }
        title: { type: string }
        description: { type: string }
        amount_type: { type: string }
        amount: { type: integer, nullable: true }
        currency: { type: string }
        min_amount: { type: integer, nullable: true }
        max_amount: { type: integer, nullable: true }
        is_active: { type: boolean }
        expires_at: { type: string, format: date-time, nullable: true }
        environment: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    PublicPaymentLinkResponse:
      type: object
      description: Safe subset for the unauthenticated pay page — no merchant_id.
      properties:
        slug: { type: string }
        title: { type: string }
        description: { type: string }
        amount_type: { type: string }
        amount: { type: integer, nullable: true }
        currency: { type: string }
        min_amount: { type: integer }
        max_amount: { type: integer }
        is_available: { type: boolean }
        reason: { type: string, enum: [inactive, expired, ''] }
        environment: { type: string }
